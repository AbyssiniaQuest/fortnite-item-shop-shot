name: Apply auto-post settings

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.title == 'Configure auto-posting' &&
      contains(github.event.issue.body, '<!-- auto-post-settings -->') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and save settings
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/apply-auto-post-settings.mjs

      - name: Commit settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/auto-post-config.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update auto-post settings"
          git push

      - name: Confirm and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Auto-post settings saved. The website will refresh after GitHub Pages redeploys.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
