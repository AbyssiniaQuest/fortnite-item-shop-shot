name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Daily shop cache key
        id: shop-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily shop and artwork
        uses: actions/cache@v4
        with:
          path: |
            .shop-cache
            public/shop-assets
          key: shop-art-v1-${{ steps.shop-day.outputs.day }}
          restore-keys: shop-art-v1-

      - name: Build static site
        run: npm run build:github
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/fortnite-item-shop-shot"

      - name: Install verification browser
        run: npx playwright install --with-deps chromium

      - name: Verify PNG exports and mobile controls
        run: npm run test:generator

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
